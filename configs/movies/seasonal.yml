  Shamrock Stories:
    template:
      name: seasonal
      season: patrick
      schedule: range(03/01-03/17)
    trakt_list:
      - https://trakt.tv/users/planetjimbo/lists/st-patrick-s-day-collection
      - https://trakt.tv/users/madmapper/lists/st-patrick-s-day
      - https://trakt.tv/users/blazin887/lists/st-patricks-day
