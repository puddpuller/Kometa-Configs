######################################################
#                Seasonal Collections                #
######################################################

templates:
  seasonal:
    label: season_<<season>>
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/seasonal/<<season>>.png
    schedule: <<schedule>>
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: ++++++<<collection_name>>
    collection_order: random

######################################################
#                   COLLECTIONS                      #
######################################################

collections:

  Santa’s Nice List:
    template:
      name: seasonal
      season: christmas
      schedule: range(11/01-12/31)
    trakt_list:
      - https://trakt.tv/users/k0meta/lists/christmas-extravaganza-non-tv-movie
      - https://trakt.tv/users/ubjeckle/lists/christmas-movies
      - https://trakt.tv/users/littlestella3/lists/christmas
      - https://trakt.tv/users/triadcool/lists/christmas
      - https://trakt.tv/users/pterisaur/lists/christmas
      - https://trakt.tv/users/oldmankestis/lists/christmas
      - https://trakt.tv/users/biggsandroid/lists/christmas
    summary: >
      A festive collection celebrating the spirit, traditions, and magic of the holiday season —
      from timeless classics to modern favorites.

  Spooktober:
    template:
      name: seasonal
      season: halloween
      schedule: range(09/15-10/31)
    trakt_list:
      - https://trakt.tv/users/oldmankestis/lists/horror
      - https://trakt.tv/users/movistapp/lists/horror
      - https://trakt.tv/users/g0g0/lists/horror
      - https://trakt.tv/users/pterisaur/lists/halloween
      - https://trakt.tv/users/k0meta/lists/spooktober-copy
    plex_search:
      any:
        genre: Horror
    summary: >
      Films celebrating Halloween, spooky folklore, and horror traditions —
      ranging from lighthearted scares to atmospheric chills.

  Cupid’s Favorites:
    template:
      name: seasonal
      season: valentine
      schedule: range(02/01-02/14)
    trakt_list:
      - https://trakt.tv/users/martincz29/lists/valentine
      - https://trakt.tv/users/planetjimbo/lists/valentine-s-day-collection
      - https://trakt.tv/users/triadcool/lists/valentine
      - https://trakt.tv/users/oya-kesh/lists/seasonal-valentine
      - https://trakt.tv/users/dweagle79/lists/valentine-s-day
    summary: >
      Celebrate love in all its forms with romantic films and heartfelt stories
      about connection, passion, and meaningful relationships.

  Roots & Rise – Black History Stories:
