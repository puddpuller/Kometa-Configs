######################################################
#                Seasonal Collections                #
######################################################

templates:
  seasonal:
    label: season_<<season>>
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/seasonal/<<season>>.png
    schedule: <<schedule>>
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: ++++++<<collection_name>>

######################################################
#                   COLLECTIONS                      #
######################################################

collections:

  Santa’s Nice List:
    template:
      name: seasonal
      season: christmas
      schedule: range(11/01-12/31)
    trakt_list:
      - https://trakt.tv/users/k0meta/lists/christmas-extravaganza-non-tv-movie
      - https://trakt.tv/users/ubjeckle/lists/christmas-movies
      - https://trakt.tv/users/littlestella3/lists/christmas
      - https://trakt.tv/users/triadcool/lists/christmas
      - https://trakt.tv/users/pterisaur/lists/christmas
      - https://trakt.tv/users/oldmankestis/lists/christmas
      - https://trakt.tv/users/biggsandroid/lists/christmas
    summary: >
      A festive collection celebrating the spirit, traditions, and magic of the holiday season —
      from timeless classics to modern favorites.

  Spooktober:
    template:
      name: seasonal
      season: halloween
      schedule: range(09/15-10/31)
    trakt_list:
      - https://trakt.tv/users/oldmankestis/lists/horror
      - https://trakt.tv/users/movistapp/lists/horror
      - https://trakt.tv/users/g0g0/lists/horror
      - https://trakt.tv/users/pterisaur/lists/halloween
      - https://trakt.tv/users/k0meta/lists/spooktober-copy
    plex_search:
      any:
        genre: Horror
    summary: >
      Films celebrating Halloween, spooky folklore, and horror traditions —
      ranging from lighthearted scares to atmospheric chills.

  Cupid’s Favorites:
    template:
      name: seasonal
      season: valentine
      schedule: range(02/01-02/14)
    trakt_list:
      - https://trakt.tv/users/martincz29/lists/valentine
      - https://trakt.tv/users/planetjimbo/lists/valentine-s-day-collection
      - https://trakt.tv/users/triadcool/lists/valentine
      - https://trakt.tv/users/oya-kesh/lists/seasonal-valentine
      - https://trakt.tv/users/dweagle79/lists/valentine-s-day
    summary: >
      Celebrate love in all its forms with romantic films and heartfelt stories
      about connection, passion, and meaningful relationships.

  Roots & Rise – Black History Stories:
    template:
      name: seasonal
      season: black-history
      schedule: range(02/01-02/29)
    trakt_list:
      - https://trakt.tv/users/madmapper/lists/black-history
      - https://trakt.tv/users/jenninja/lists/black-history-docs
      - https://trakt.tv/users/bluephi8/lists/black-history
      - https://trakt.tv/users/chadee93/lists/black-shows-movies-black-leads
    summary: >
      Celebrates the achievements, stories, and cultural contributions of Black individuals
      throughout history, honoring the past, present, and future.

  Bunnies & Blessings:
    template:
      name: seasonal
      season: easter
      schedule: range(03/20-04/30)
    trakt_list:
      - https://trakt.tv/users/axee4/lists/easter
      - https://trakt.tv/users/neyoke/lists/easter
      - https://trakt.tv/users/blakemp/lists/easter
      - https://trakt.tv/users/trovolar/lists/easter
      - https://trakt.tv/users/blazin887/lists/easter
      - https://trakt.tv/users/dvitale71/lists/easter
    summary: >
      Celebrate the joy and renewal of Easter with a blend of fun, family-friendly rabbit
      adventures and inspiring stories of faith, hope, and new beginnings.

  Shamrock Stories:
    template:
      name: seasonal
      season: patrick
      schedule: range(03/01-03/17)
    trakt_list:
      - https://trakt.tv/users/planetjimbo/lists/st-patrick-s-day-collection
      - https://trakt.tv/users/madmapper/lists/st-patrick-s-day
      - https://trakt.tv/users/blazin887/lists/st-patricks-day
    summary: >
      Celebrate St. Patrick’s Day with films and stories filled with charm, folklore,
      mischief, and a touch of festive magic.
