      - https://trakt.tv/users/xanatos-david/lists/japanese-movies
      - https://trakt.tv/users/komobu/lists/korean-movies
    summary: >
     Celebrate the histories, cultures, and creative voices of Asian and Pacific Islander communities through a diverse selection of films and shorts. Spanning generations and genres, these stories highlight tradition, resilience, and contemporary life, honoring the lasting impact and rich contributions of Asian and Pacific Islander heritage.
     
