#########################
# SEASONAL COLLECTIONS #
#########################

templates:
  seasonal:
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/seasonal/<<season>>.png
    schedule: <<schedule>>
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: ++++++<<collection_name>>


collections:

  Santa’s Nice List:
    template:
      name: seasonal
      season: Christmas
      schedule: range(11/01-12/31)
    smart_filter:
      all:
        label: season_christmas
    summary: >
      This collection brings together festive films and shorts that celebrate the spirit,
      traditions, and history of the holiday season — from timeless classics to modern favorites.

  Spooktober:
    template:
      name: seasonal
      season: Halloween
      schedule: range(09/15-10/31)
    smart_filter:
      all:
        label: season_halloween
    summary: >
      Films and shorts celebrating Halloween, spooky folklore, and horror traditions —
      ranging from lighthearted scares to atmospheric chills.

  Cupid’s Favorites:
    template:
      name: seasonal
      season: Valentine
      schedule: range(02/01-02/14)
    smart_filter:
      all:
        label: season_valentine
    summary: >
      Celebrate love in all its forms with this collection of romantic films and shorts. From timeless classics to modern tales of connection, passion, and heartfelt moments, these stories explore the joys, challenges, and magic of love.

  Roots & Rise - Black History Stories:
    template:
      name: seasonal
      season: Black-History
      schedule: range(02/01-02/29)
    smart_filter:
      all:
        label: season_black-history
    summary: >
      Celebrates the achievements, stories, and cultural contributions of Black individuals throughout history. Featuring inspiring historical films, powerful tales of resilience and creativity, as well as contemporary movies with Black leads, it honors the past, highlights the present, and inspires the future.

  Bunnies & Blessings:
    template:
      name: seasonal
      season: Easter
      schedule: range(03/20-04/30)
    smart_filter:
      all:
        label: season_easter
    summary: >
      Celebrate the joy and renewal of Easter with this diverse collection of films and shorts. Featuring fun, family-friendly rabbit adventures alongside inspiring stories of faith, these titles highlight themes of hope, friendship, and new beginnings, capturing both the playful and spiritual spirit of the season.

  Shamrock Stories:
    template:
      name: seasonal
      season: Patrick
      schedule: range(03/01-03/17)
    smart_filter:
      all:
        label: season_patrick
    summary: >
      Celebrate St. Patrick’s Day with a collection of films and shorts that capture the magic, mischief, and charm of the holiday. Featuring whimsical adventures, folklore-inspired tales, and even a few spooky or mischievous stories, this collection blends fun, fantasy, and festive spirit for viewers of all tastes.

  
