#########################
# SEASONAL COLLECTIONS #
#########################

templates:
  seasonal:
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/seasonal/<<season>>.png
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: ++++++<<collection_name>>


collections:

  Santa’s Nice List:
    template:
      name: seasonal
      season: Christmas
    schedule: range(11/01-12/31)
    smart_filter:
      all:
        label: season_christmas
    summary: >
      This collection brings together festive films and shorts that celebrate the spirit,
      traditions, and history of the holiday season — from timeless classics to modern favorites.

  Spooktober:
    template:
      name: seasonal
      season: Halloween
    schedule: range(09/15-10/31)
    smart_filter:
      all:
        label: season_halloween
    summary: >
      Films and shorts celebrating Halloween, spooky folklore, and horror traditions —
      ranging from lighthearted scares to atmospheric chills.

  Cupid’s Favorites:
    template:
      name: seasonal
      season: Valentine
    schedule: range(02/01-02/14)
    smart_filter:
      all:
        label: season_valentine
    summary: >
      Celebrate love in all its forms with this collection of romantic films and shorts,
      from timeless classics to modern tales of connection and passion.

  Roots & Rise - Black History Stories:
    template:
      name: seasonal
      season: Black-History
    schedule: range(02/01-02/29)
    smart_filter:
      all:
        label: season_black-history
    summary: >
      Celebrates the achievements, stories, and cultural contributions of Black individuals
      throughout history, honoring the past while highlighting the present.

  Bunnies & Blessings:
    template:
      name: seasonal
      season: Easter
    schedule: range(03/20-04/30)
    smart_filter:
      all:
        label: season_easter
    summary: >
      Celebrate the joy and renewal of Easter with a mix of fun, family-friendly rabbit
      adventures and inspiring stories of faith, hope, and new beginnings.

  Shamrock Stories:
    template:
      name: seasonal
      season: Patrick
    schedule: range(03/01-03/17)
    smart_filter:
      all:
        label: season_patrick
    summary: >
      Celebrate St. Patrick’s Day with films and shorts inspired by folklore, whimsy,
      mischief, and Irish-themed storytelling — from festive fun to darker tales.
