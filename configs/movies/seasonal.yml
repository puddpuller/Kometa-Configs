######################################################
#                Seasonal Collections                #
######################################################

templates:
  seasonal:
    label: season_<<season>>
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/seasonal/<<season>>.png
    schedule: <<schedule>>
    visible_library: true
    visible_home: true
    visible_shared: true
    sort_title: ++++++<<collection_name>>
    collection_order: random

collections:

######################################################
#                     HOLIDAY                        #
######################################################

  "Cheers to a New Year":
    template:
      name: seasonal
      season: new-year
      schedule: range(12/26-01/07)
    trakt_list:
      - https://trakt.tv/users/xpinkfrogx/lists/confetti_ball-new-year-s-movies-confetti_ball
      - https://trakt.tv/users/laurenceibrahim/lists/ringing-in-the-new-year
      - https://trakt.tv/users/blazin887/lists/new-year
      - https://trakt.tv/users/threespoons/lists/new-year-s-movies
    summary: >
      Celebrate the start of a new year with films and shorts that capture 
      reflection, celebration, and fresh beginnings. From festive countdowns 
      and joyful gatherings to thoughtful stories about change and hope, these 
      titles embrace the excitement of turning the page and welcoming what 
      comes next.

  "Legends of the Lunar New Year":
    template:
      name: seasonal
      season: lunar
      schedule: range(01/21-02/20)
    trakt_list:
      - https://trakt.tv/users/asnguy01/lists/chinese-movies
      - https://trakt.tv/users/sandstorms/lists/horse-movies-shows
    summary: >
      Celebrate the Lunar New Year with a vibrant mix of films and shorts inspired by tradition,
      folklore, and cultural storytelling. Alongside themes of renewal, luck, and togetherness,
      this collection embraces the spirit and symbolism of the year’s zodiac sign, weaving its
      traits and energy into stories that honor heritage while welcoming new beginnings.

