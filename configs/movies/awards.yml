######################################################
#                  Awards Collections                #
######################################################

templates:
  awards:
    smart_label:
      sort_by: release.desc
      all:
        label: <<smart_label>>
    sort_title: ++++<<collection_name>>

  cannes_palm_only:
    default: cannes
    template_variables:
      use_palm: true
      name_palm: "Cannes Palme d'Or Winners"
      collection_order: release.desc
    sort_title: ++++<<collection_name>>
    
collections:
  Oscars:
    template: {name: awards}
    url_poster: https://raw.githubusercontent.com/puddpuller/Kometa-Configs/main/configs/assets/awards/Oscars.png
    trakt_list: https://trakt.tv/users/pandali/lists/oscar-nomination-1975-2023
    summary: Every movie to receive an Oscar nomination from 1931-Present.

  "Cannes Palme d'Or Winners":
    template:
      name: cannes_palm_only
    #radarr_add_missing: true
