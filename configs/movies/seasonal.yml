  Legends of the Lunar New Year:
    template:
      name: seasonal
      season: lunar
      schedule: range(01/21-02/20)
    trakt_list:
      - https://trakt.tv/users/sandstorms/lists/horse-movies-shows
    summary: >
     Celebrate the Lunar New Year with a vibrant mix of films and shorts inspired by tradition, folklore, and cultural storytelling. Alongside themes of renewal, luck, and togetherness, this collection embraces the spirit and symbolism of the year’s zodiac sign, weaving its traits and energy into stories that honor heritage while welcoming new beginnings.

  Voices of Asia and the Pacific:
    template:
      name: seasonal
      season: asia-pacific
      schedule: range(05/01-05/31)
    trakt_list:
